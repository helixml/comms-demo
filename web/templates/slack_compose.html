<!doctype html>
<html lang="en" data-theme="light">
<head>
{{ template "head" (dict "Title" "New DM · Slack mock") }}
<style>.slack-aubergine { background: #3F0E40; color: #fff; }</style>
</head>
<body class="bg-white">

<div class="flex flex-col h-screen">
  <div class="slack-aubergine px-3 py-2 flex items-center gap-2">
    <a class="text-white" href="/channel/{{ .Channel.ChannelID }}{{ if .Frame }}?frame=phone{{ end }}">←</a>
    <div class="text-sm font-semibold">New direct message</div>
  </div>
  <form class="flex-1 flex flex-col p-3 gap-2" method="post"
        action="/channel/{{ .Channel.ChannelID }}/compose{{ if .Frame }}?frame=phone{{ end }}">
    <label class="label-text text-xs text-neutral-500">From <span class="font-mono">{{ .Channel.LocalIdentity }}</span></label>
    <input class="input input-bordered input-sm" name="to" placeholder="To: U0123ABCD or #channel" required>
    <input class="input input-bordered input-sm" name="subject" placeholder="(optional thread topic)">
    <textarea class="textarea textarea-bordered flex-1" name="body" placeholder="Write a message…" required></textarea>
    <div class="flex justify-end gap-2">
      <a class="btn btn-sm btn-ghost" href="/channel/{{ .Channel.ChannelID }}{{ if .Frame }}?frame=phone{{ end }}">Cancel</a>
      <button class="btn btn-sm btn-success text-white" type="submit">Send</button>
    </div>
  </form>
</div>

</body>
</html>
