<!doctype html>
<html lang="en" data-theme="light">
<head>
{{ template "head" (dict "Title" "New Message") }}
<style>body { background: #fff; } .ios-header { background: #f9f9fb; }</style>
</head>
<body>

<div class="flex flex-col h-screen">
  <div class="ios-header sticky top-0 z-10 border-b border-neutral-200 px-2 py-2 flex items-center">
    <a class="text-blue-500" href="/channel/{{ .Channel.ChannelID }}{{ if .Frame }}?frame=phone{{ end }}">Cancel</a>
    <div class="text-base font-semibold mx-auto">New Message</div>
    <span class="w-12"></span>
  </div>
  <form class="flex-1 flex flex-col p-3 gap-2" method="post"
        action="/channel/{{ .Channel.ChannelID }}/compose{{ if .Frame }}?frame=phone{{ end }}">
    <label class="label-text text-xs text-neutral-500">From <span class="font-mono">{{ .Channel.LocalIdentity }}</span></label>
    <input class="input input-bordered input-sm" name="to" placeholder="To: +15551234567" required>
    <input type="hidden" name="subject" value="">
    <textarea class="textarea textarea-bordered flex-1 rounded-2xl" name="body" placeholder="iMessage" required></textarea>
    <div class="flex justify-end">
      <button class="btn btn-sm btn-primary" type="submit">Send</button>
    </div>
  </form>
</div>

</body>
</html>
